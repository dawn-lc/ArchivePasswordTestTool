name: CI

# 日常验证：提交与 PR 都跑完整的「构建 → 测试 → 发布 → 产物校验」链路。
# 之所以在 CI 里也做 publish：裁剪（PublishTrimmed）与内置 COM 互操作的问题
# 只在 publish 路径暴露，普通 build 与 E2E 测不到，而它恰恰是用户实际拿到的产物。
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支的新提交取消旧运行，避免排队浪费额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 构建供应链版本：固定而非跟 latest。
# 跟随 latest 时，同一 commit 的两次构建可能拿到不同的 7z.dll / UPX，产物不可重现；
# 上游发新版也会在没有任何代码变更的情况下改变产物大小与哈希。
# 升级方式：改这里两个值（同时会让 tools 缓存失效，下次重新下载）。
env:
  SEVEN_ZIP_VERSION: '26.05'
  UPX_VERSION: '5.2.1'
  RESVG_VERSION: '0.49.0'

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and verify published binary
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 项目未启用 packages.lock.json，以 csproj 作为缓存 key（依赖版本变更即失效）
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      # tools\ 被 .gitignore 排除（7z.dll / upx.exe 不入库），所以缓存要显式做。
      # 不缓存的话每个 job 都要重新下载 7zr.exe + 7-Zip 安装包 + UPX 发行包，
      # 网络抖动就直接变成一次构建失败（本仓库碰过多次间歇性 TLS 断连）。
      # key 里带版本：升级版本时自然失效，不会拿到旧版本的缓存。
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: |
            tools/upx
            tools/7zip
            tools/resvg
          key: build-tools-${{ runner.os }}-7z${{ env.SEVEN_ZIP_VERSION }}-upx${{ env.UPX_VERSION }}-resvg${{ env.RESVG_VERSION }}

      - name: Build and verify
        uses: ./.github/actions/build-verify
        with:
          sevenZipVersion: ${{ env.SEVEN_ZIP_VERSION }}
          upxVersion: ${{ env.UPX_VERSION }}
          resvgVersion: ${{ env.RESVG_VERSION }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload published binary
        uses: actions/upload-artifact@v4
        with:
          name: ArchivePasswordTestTool-win-x64
          path: ArchivePasswordTestTool/bin/Release/net10.0/win-x64/publish/ArchivePasswordTestTool.exe
          if-no-files-found: error
          retention-days: 7

      # AOT 是**对外发布形态**（见 release.yml），因此在 CI 里必须有独立产物留档，
      # 否则「AOT 能构建并通过验收」这句结论无法复核。
      - name: Upload AOT binary
        uses: actions/upload-artifact@v4
        with:
          name: ArchivePasswordTestTool-win-x64-aot
          path: dist/aot/ArchivePasswordTestTool.exe
          if-no-files-found: error
          retention-days: 7
