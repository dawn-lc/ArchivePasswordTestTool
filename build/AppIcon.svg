<?xml version="1.0" encoding="UTF-8"?>
<!--
  程序图标的唯一源文件。构建时由 resvg 渲染成各尺寸透明 PNG
  （16/20/24/32/40/48/64/256），再由 build\AppIconTask.cs 打包成 ICO，
  产物落在 obj\<Config>\<TargetFramework>\AppIcon.ico，
  仓库里不保存任何 .ico——改了本文件，下一次构建自动重新生成。

  resvg 是完整的 SVG 渲染器（贝塞尔曲线、transform、渐变、mask、text 都支持），
  因此本文件可以随便用标准 SVG，浏览器 / VS Code 预览看到的就是最终效果。
  唯一值得留意的是 resvg 的告警：它遇到自己不支持的属性会往 stderr 提一句，
  那些告警会出现在构建日志里，不会静默地画错。

  图案：空心圆环 + 中间一把「打开」的挂锁（实心锁体、钥匙孔抠空）。
  几何是量出来的，不是手调的。旧版 ArchivePasswordTestTool.exe 里只有一个图标组，
  且**只含一帧 128×128**（组名 IDI_APPLICATION 的 32512）——之前用 ExtractIconEx
  拿到的 32/16 是系统把它缩小后的结果，按那个量会得到错的描边粗细。
  直接读出 RT_ICON 的 128×128 原图逐行扫描后，各元素如下（本文件用 256 视图框，坐标 = 原图 ×2）：

                 原图 128 空间                    本文件 256 空间
    圆环      外缘 0..126，内缘 6..121，描边 7      圆心 (127.5,127.9)，中心线 r=120.6，描边 13.8
    锁体      x 28.5..99，y 56.9..107.5，圆角 8   x 57.5..198，y 113.5..215，rx=16
    锁孔      圆 r=8.5 心 (63.5,74.5)              圆 r=17 心 (127,149)
              槽宽 10，从 y=81 到 y=99              槽宽 20，从 y=163 到 y=198
    锁梁      圆弧圆心 (67,38)，r=20，描边 10.5    M 91 86 L 95 68 A 40 40 0 0 1 173 84 L 167 115
              圆弧两端分别落在 (47.5,34) 与 (86.5,42)，再各接一条直腿，描边 21

  **锁梁是斜的，不是摆正的拱形。** 这是整个图标最难复现、也最容易被当成「画歪了而顺手扶正」的地方：
  逐行量出两条腿的中心线后发现它们都是直的，且斜率都是 −0.2（左腿从 y=34 的 x=47.5
  到 y=46 的 x=45；右腿从 y=42 的 x=86.5 到 y=56 的 x=83.5）——两条腿同向向左歪 11.5°，
  等价于整条挂锁梁顺时针转了约 12°。纯圆弧做不出这个效果（圆旋转后还是自己），
  所以这里必须写成「顶部一段圆弧 + 两条直腿」，而不是一条大圆弧。
  左腿只画到 y=43（带圆头端点，外缘到 48.5），右腿一直落到 y=57.5 接上锁体：左高右低。

  两处容易被「修正」错的地方：
    ① 圆环描边只有锁梁的一半粗（原图 7 vs 10.5）。这不是笔误，统一粗细反而和原版对不上。
    ② 锁体不是纯色方块：钥匙孔是「圆 + 下接略变宽的槽」，槽底距锁体底还有 8px（原图），
       不是通到底的开口。

  主色 #36353B 也是取色结果（原图 3786 个不透明像素里 RGB(54,53,59) 占 3797 个）。

  钥匙孔与圆环的关键交点：槽顶两端 (117,163) 与 (137,163) 正好落在圆的轮廓上
  （相对圆心 (127,149) 的 dx=±10、dy=14，√(100+196)=17.2）。因此圆弧与槽能接成
  一条无缝隙、无重叠的闭合轮廓，不需要任何 mask。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>ArchivePasswordTestTool</title>
  <g fill="none" stroke="#36353B" stroke-width="13.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="127.5" cy="127.9" r="120.6" />
  </g>
  <!--
    锁梁：顶部一段圆弧 + 两条直腿，整体呈顺时针约 12° 的倾斜（见文件头说明）。
    圆弧两端 (95,68) 与 (173,84) 是圆弧与直腿的**切点**：其切线方向恰好等于两条腿的
    斜率，所以弧与腿能平滑相接，不需要圆角过渡。
    弧从左侧切点 (95,68) 走上方到右侧切点 (173,84)，恰好半圈，large-arc 写 0 或 1 等价。
  -->
  <g fill="none" stroke="#36353B" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 91 86 L 95 68 A 40 40 0 0 1 173 84 L 167 115" />
  </g>
  <!--
    锁体 + 钥匙孔写在同一个 path 里，两条子路径靠 fill-rule="evenodd" 挖空。
    钥匙孔 = 上半圆 + 向下略变宽的窄槽，接成一条闭合轮廓：槽顶两个角 (117,163)/(137,163)
    正好落在圆上（相对圆心 (127,149) 的 dx=±10、dy=14，√(100+196)=17.2≈17），
    所以圆弧与槽之间既无缝也无重叠——重叠会让 even-odd 把交叠处填回去。
    圆弧从槽顶左角绕过顶部到右角，large-arc=1 走 288.9°（短的 71.1° 那道是圆的底部，不能要）。
    两条子路径绕序相反（锁体顺时针、钥匙孔逆时针），这样即使某个渲染器按 nonzero 规则算，
    也照样挖得出洞。
  -->
  <path fill="#36353B" fill-rule="evenodd" d="M 73.5 113.5 L 182 113.5 A 16 16 0 0 1 198 129.5 L 198 199 A 16 16 0 0 1 182 215 L 73.5 215 A 16 16 0 0 1 57.5 199 L 57.5 129.5 A 16 16 0 0 1 73.5 113.5 Z M 117 163 A 17 17 0 1 1 137 163 L 137 198 L 117 198 Z" />
</svg>
